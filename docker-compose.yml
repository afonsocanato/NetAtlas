# One-command setup: backend + frontend.
# The discovery agent is intentionally NOT containerized here — it needs
# direct access to the host's network stack (ARP table, real LAN), which
# containers don't provide by default. Run it on the host: see agent/README.md.
#
# Requires a Supabase project: run backend/supabase/schema.sql once in its
# SQL Editor, then put SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in a `.env`
# file next to this one (docker compose reads it automatically) — see
# backend/README.md for where to find those values.
services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AGENT_API_KEY: change-me-to-a-random-secret
      OFFLINE_AFTER_MISSED_REPORTS: 2
      CORS_ORIGIN: http://localhost:5173
      # Login is on by default — unset, so the backend generates a random
      # admin username/password on first boot and prints it once to
      # `docker compose logs backend`. Set both here to pin your own
      # (recommended before exposing this beyond localhost — see
      # docs/DEPLOYMENT.md).
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: change-me

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - backend
